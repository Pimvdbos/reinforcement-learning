<text x="850" y="206" class="muted" font-size="14" text-anchor="middle">fully invested</text>
<rect x="990" y="100" width="165" height="150" rx="14" class="box"/>
<text x="1072.5" y="134" class="t" font-size="17" text-anchor="middle" font-weight="700">Portfolio step</text>
