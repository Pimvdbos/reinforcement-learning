<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
<rect width="1200" height="440" rx="18" fill="#ffffff"/>
<style>
  .t{font-family:Arial,Helvetica,sans-serif;fill:#111827}
  .muted{font-family:Arial,Helvetica,sans-serif;fill:#4b5563}
  .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
