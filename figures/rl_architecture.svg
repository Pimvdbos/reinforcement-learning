<text x="385" y="182" class="muted" font-size="14" text-anchor="middle">2 market features</text>
<text x="385" y="204" class="muted" font-size="14" text-anchor="middle">drawdown + prior weights</text>
<text x="385" y="229" class="t" font-size="14" text-anchor="middle" font-weight="700">116 dimensions</text>
<rect x="535" y="100" width="175" height="150" rx="14" class="orange"/>
<text x="622.5" y="134" class="t" font-size="18" text-anchor="middle" font-weight="700">PPO</text>
<text x="622.5" y="163" class="muted" font-size="14" text-anchor="middle">actor-critic policy</text>
<text x="622.5" y="185" class="muted" font-size="14" text-anchor="middle">Stable-Baselines3</text>
<text x="622.5" y="210" class="muted" font-size="14" text-anchor="middle">continuous control</text>
<rect x="760" y="100" width="180" height="150" rx="14" class="green"/>
