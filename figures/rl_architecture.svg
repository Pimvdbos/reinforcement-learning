  </marker>
</defs>
<text x="600" y="36" class="t" font-size="24" text-anchor="middle" font-weight="700">PPO portfolio-allocation loop</text>
<text x="600" y="62" class="muted" font-size="14" text-anchor="middle">Information available at t determines weights; returns are realized at t+1</text>
<rect x="45" y="115" width="190" height="120" rx="14" class="box"/>
<text x="140" y="145" class="t" font-size="17" text-anchor="middle" font-weight="700">Market data</text>
