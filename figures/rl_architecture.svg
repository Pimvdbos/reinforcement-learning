<text x="140" y="196" class="muted" font-size="14" text-anchor="middle">S&amp;P 500</text>
<text x="140" y="218" class="muted" font-size="14" text-anchor="middle">2010–2024</text>
<rect x="285" y="100" width="200" height="150" rx="14" class="accent"/>
