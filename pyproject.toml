[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-portfolio-allocation"
version = "0.1.0"
description = "PPO-based dynamic portfolio allocation with walk-forward evaluation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "torch>=2.1",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "yfinance>=0.2.40",
    "PyPortfolioOpt>=1.5.5",
    "matplotlib>=3.8",
    "shap>=0.45",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
